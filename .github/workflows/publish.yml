name: Publish package to NPM

on:
  push:
    tags:
      - 'v0.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch release branch
        run: git fetch origin v0.x

      - name: Verify tag matches package.json version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Tag $GIT_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify tag is on v0.x branch
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GIT_TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/v0.x; then
            echo "::error::Tag $GIT_TAG does not point to a commit on the v0.x branch"
            exit 1
          fi

  publish:
    name: Publish to NPM
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to NPM
        run: npm publish --provenance --access public --tag legacy
